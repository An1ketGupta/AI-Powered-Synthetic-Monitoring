name = "edgewatch"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
# Required when the authenticated user has access to more than one account.
# Override without editing this file by setting CLOUDFLARE_ACCOUNT_ID.
account_id = "3dda47df80065f561ddaee0c1f6b310e"

# --- Non-secret configuration ---------------------------------------------
[vars]
DEFAULT_CHECK_INTERVAL_SECONDS = "60"
DEFAULT_TIMEOUT_MS = "10000"
CONSECUTIVE_FAILURES_FOR_INCIDENT = "2"
SIMILAR_INCIDENTS_TOP_K = "3"
# "true" exposes GET /api/monitors and /api/incidents without a token so the
# deployment can be shared as a live demo. Writes always require API_TOKEN.
# Set to "false" for a private deployment.
PUBLIC_READ_ONLY = "true"

# --- Static assets (React dashboard build) ---------------------------------
[assets]
directory = "../dashboard/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# This wrangler version only supports a boolean here (per-path glob patterns
# are a wrangler v4 feature) -- the Worker runs first for every request and
# explicitly proxies non-API paths to ASSETS itself (see src/index.ts).
run_worker_first = true

# --- D1: monitors, checks, incidents ---------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "edgewatch-db"
database_id = "1bff2a8d-80ae-4a42-93a0-a34701e298d0"

# --- KV: hot cache of active monitor configs for the cron sweep ------------
[[kv_namespaces]]
binding = "CONFIG_CACHE"
id = "de6ae0b50ec4489ebb5df63662543114"

# --- Durable Objects: one MonitorState instance per monitored target -------
[[durable_objects.bindings]]
name = "MONITOR_STATE"
class_name = "MonitorState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MonitorState"]

# --- Queues: fan-out for incident alerts ------------------------------------
# Create with (the 86400s retention is the Workers Free plan maximum; the
# wrangler default of 345600s is rejected on that plan):
#   wrangler queues create edgewatch-alerts --message-retention-period-secs 86400
[[queues.producers]]
binding = "ALERT_QUEUE"
queue = "edgewatch-alerts"

[[queues.consumers]]
queue = "edgewatch-alerts"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# --- Workers AI: incident summarization + embeddings ------------------------
[ai]
binding = "AI"

# --- Vectorize: semantic search over past incidents -------------------------
# Create with:
#   wrangler vectorize create edgewatch-incidents --dimensions=768 --metric=cosine
#   wrangler vectorize create-metadata-index edgewatch-incidents --property-name=monitorId --type=string
# 768 dimensions matches @cf/baai/bge-base-en-v1.5 (see src/ai/models.ts).
[[vectorize]]
binding = "INCIDENTS_INDEX"
index_name = "edgewatch-incidents"

# --- Cron Triggers: the edge health-check sweep -----------------------------
[triggers]
crons = ["*/1 * * * *"]
