name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The dashboard build must come first: wrangler.toml points its assets
      # binding at dashboard/dist, so the Worker won't bundle without it.
      - name: Build dashboard
        run: npm run build:dashboard

      - name: Typecheck worker
        run: npm run typecheck --workspace=worker

      - name: Test worker
        run: npm test

      - name: Verify worker bundles
        run: npx wrangler deploy --dry-run
        working-directory: worker
